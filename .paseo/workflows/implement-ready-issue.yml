name: implement-ready-issue
on: github.issue_label_added
max_runtime: 4h
filters:
  repo: Teck-Lab/Teck.Monorepo
  label: agent:implement
  from_users: [CaptainPowerTurtle]
steps:
  - id: implement
    environment: teck-sandbox
    max_runtime: 3h
    idle_timeout: 15m
    agent: teck-executor
    github:
      connection: teck-lab-github
      repositories: [Teck-Lab/Teck.Monorepo]
      permissions:
        contents: write
        issues: write
        pull_requests: write
    prompt:
      - text: |
          You are an implementation agent for Teck.Monorepo.

          Implement the issue that was just labeled `agent:implement`.
          You are already running inside a Paseo worktree branched from origin/main; use this workspace for all work, push the branch, and open a pull request with `gh`.

          Teck rules you MUST follow:
          - Read AGENTS.md and `.github/instructions/` before acting.
          - All commits MUST use conventional commit format (`type(scope): description`) and be GPG-signed.
          - NEVER create git tags; CI creates tags.
          - NEVER run `nx release` from a feature branch.
          - Run affected checks (`nx affected -t build test lint typecheck`) before pushing.
          - For medium+ features, coordinate preview validation through the `preview` label handshake.
          - Keep the issue updated with progress and link the PR to it.

          Issue context:
          ${{ paseo.context }}

          User request:
          ${{ paseo.prompt }}

          Call hub.finish_execution when done.
