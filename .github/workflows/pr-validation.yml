name: PR Validation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  affected-checks:
    name: Nx affected build/test/lint/typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run affected build/test/lint/typecheck
        run: |
          bunx nx affected -t build test lint typecheck \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}"

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run the ArchUnit architecture tests directly. `nx affected --projects=X` is
      # invalid (--projects is a run-many flag) and leaked to `dotnet test` as an
      # unknown switch (MSB1001). Running the project's target is cache-hit fast when
      # nothing it depends on changed.
      - name: Run architecture tests
        run: bunx nx run Teck.Platform.Arch.Tests:test

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run affected Docker builds
        run: |
          bunx nx affected -t docker:build \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}"

  security-scans:
    name: Security scans
    uses: ./.github/workflows/security-scans.yml
    # Pass required secrets to the reusable workflow.
    secrets: inherit
