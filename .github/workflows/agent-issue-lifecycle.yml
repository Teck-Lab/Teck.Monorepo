name: Agent Issue Lifecycle

on:
  issues:
    types: [labeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  apply:
    name: Apply agent lifecycle policy
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'labeled' || startsWith(github.event.label.name, 'agent:')
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App Project token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-issues: write
          permission-organization-projects: write

      - name: Checkout lifecycle policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Synchronize labels or apply transition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/agent-lifecycle.mjs
