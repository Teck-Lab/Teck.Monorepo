name: zz-probe-reusable
on:
  push:
    branches: [feat/per-service-secobserve-independent-release]
jobs:
  probe:
    uses: ./.github/workflows/_zz-stub.yml
    with:
      service-group: commerce
      service-name: order
      nx-project: Order.Host
      project-path: x
      version: probe-0
      publish-mode: staging
      staging-tag: zzprobe
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      dependencytrack-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
