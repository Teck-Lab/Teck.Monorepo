name: zz-probe-reusable
on:
  push:
    branches: [feat/per-service-secobserve-independent-release]
jobs:
  probe:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: commerce
      service-name: order
      nx-project: Order.Host
      project-path: src/services/commerce/order/Order.Host/Order.Host.csproj
      version: probe-0
      source-ref: ${{ github.sha }}
      publish-mode: staging
      staging-tag: zzprobe
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      dependencytrack-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
