name: Release Candidate
on:
  pull_request:
    types: [labeled, synchronize, closed]
    branches: [main]

# Explicit, gated release path (see docs). While a PR carries the `ready-to-release`
# label, every push builds each affected service through the reusable pipeline in
# RELEASE mode - so the Dependency Track gate runs and the RC is a required PR check
# (a red gate blocks the merge). RCs use a candidate version (rc-pr<n>.<run>) and are
# NOT marked latest in DT. When the labelled PR merges, GA cuts the real semver with
# `nx release` and rebuilds + re-gates each released service before publishing.
permissions:
  contents: read

concurrency:
  group: rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # RC lane: gated candidate builds while `ready-to-release` is on an open PR.
  # ---------------------------------------------------------------------------
  discover-rc:
    name: Discover affected services (RC)
    if: >-
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-release')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover affected services
        id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          affected=$(bunx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>/dev/null || echo "")
          [ -n "$affected" ] && export NX_AFFECTED="$affected"
          services=$(.github/scripts/discover-services.sh)
          count=$(echo "$services" | jq 'length')
          echo "matrix=$(echo "$services" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-services=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  rc-build:
    name: RC ${{ matrix.product }}
    needs: discover-rc
    if: needs.discover-rc.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-rc.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      version: rc-pr${{ github.event.pull_request.number }}.${{ github.run_number }}
      source-ref: ${{ github.event.pull_request.head.sha }}
      publish-mode: release # gate ON
      is-latest: false # an RC is never DT's latest
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      dependencytrack-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}

  # ---------------------------------------------------------------------------
  # GA lane: the labelled PR merged -> cut the semver release and ship it.
  # ---------------------------------------------------------------------------
  ga-release:
    name: GA version & tag
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit + tags
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          dotnet restore
          bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release (version, tag, GitHub release)
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version commit and tags
        run: |
          new_tags=$(git tag --points-at HEAD)
          git push origin HEAD:main
          if [ -n "$new_tags" ]; then
            # shellcheck disable=SC2086
            git push origin $new_tags
          fi

      - name: Plan per-service image builds
        id: plan
        run: |
          # Join the tags created by this release (<product>@<version>) with the
          # discovered backend services; frontend tags are excluded (no .NET image).
          discovered=$(.github/scripts/discover-services.sh)
          items='[]'
          for tag in $(git tag --points-at HEAD); do
            product="${tag%@*}"
            version="${tag##*@}"
            entry=$(echo "$discovered" | jq -c --arg p "$product" '.[] | select(.product==$p)')
            [ -z "$entry" ] && continue
            item=$(echo "$entry" | jq -c \
              --arg v "$version" --arg ref "refs/tags/$tag" \
              '. + {version: $v, sourceRef: $ref}')
            items=$(echo "$items" | jq -c --argjson it "$item" '. + [$it]')
          done
          count=$(echo "$items" | jq 'length')
          echo "matrix=$(echo "$items" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-releases=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Releasing $count service image(s):"; echo "$items" | jq -r '.[] | "\(.product) @ \(.version)"'

  ga-build:
    name: GA build ${{ matrix.product }}@${{ matrix.version }}
    needs: ga-release
    if: needs.ga-release.outputs.has-releases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ga-release.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      version: ${{ matrix.version }}
      source-ref: ${{ matrix.sourceRef }}
      publish-mode: release # gate ON (re-gated against latest advisories)
      is-latest: true # GA is DT's latest
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      dependencytrack-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
