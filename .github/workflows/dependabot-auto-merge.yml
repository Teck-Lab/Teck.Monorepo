name: Auto-merge Safe Dependabot Updates

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  reconcile:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile safe NuGet updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --author "app/dependabot" \
            --limit 100 \
            --json url,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/nuget/") and contains("-minor-patch-")) | .url' |
          while IFS= read -r pr_url; do
            [ -n "$pr_url" ] || continue

            review_decision="$(gh pr view "$pr_url" --json reviewDecision --jq '.reviewDecision')"
            if [ "$review_decision" != "APPROVED" ]; then
              gh pr review --approve "$pr_url"
            fi

            auto_merge="$(gh pr view "$pr_url" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$auto_merge" != "true" ]; then
              gh pr merge --auto --squash "$pr_url"
            fi
          done
