name: CodeQL
on:
  workflow_call:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the repository .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: ${{ matrix.language == 'csharp' }}
          # Keep PR feedback high-signal. Main and scheduled scans add GitHub's
          # broader maintained security suite, whose extra queries trade some
          # precision for coverage.
          queries: ${{ github.event_name == 'pull_request' && '' || 'security-extended' }}
      - name: Restore the complete C# solution
        if: matrix.language == 'csharp'
        run: dotnet restore Teck.Platform.slnx
      - name: Build all C# sources under CodeQL tracing
        if: matrix.language == 'csharp'
        run: dotnet build Teck.Platform.slnx --configuration Release --no-restore --no-incremental -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: /language:${{ matrix.language }}
