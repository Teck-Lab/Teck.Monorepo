name: CI
on:
  pull_request:
    branches: [main, alpha, beta, next]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, alpha, beta, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Checks
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # Container-backed integration tests can wedge (Aspire DCP, Testcontainers). Without a
    # bound these jobs inherit GitHub's 6-hour default and burn a runner on a dead run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Commit format check
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules

      - name: Commit scope and release analysis tests
        run: bun run test:release

      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/check-pr-title.mjs

      # Resolve the affected base/head for both PR and push-to-main; `nx affected`
      # otherwise defaults to --base=main, which is not a local ref on the runner
      # (checkout leaves a detached HEAD) -> "unknown revision 'main'".
      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # The sibling jobs own Aspire and architecture tests. Exclude their projects here
      # so every affected test suite runs once, while Nx still builds shared dependencies.
      - name: Affected checks
        run: bunx nx affected -t build test lint typecheck --verbose --exclude='Aspire.AppHost.IntegrationTests,*.Architecture.UnitTests'

  aspire-integration-tests:
    name: Aspire integration tests
    runs-on: ubuntu-latest
    # Container-backed: boots Keycloak, Postgres, RabbitMQ, Redis and the service stack.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Resolve selection before the condition: graph failures must fail this job rather
      # than being mistaken for an unaffected suite by an `if ... | grep` pipeline.
      - name: Aspire integration tests
        run: |
          projects=$(bunx nx show projects --affected --with-target=test --projects=Aspire.AppHost.IntegrationTests --json)
          project_list=$(jq -r 'join(",")' <<<"$projects")
          if [ -n "$project_list" ]; then
            bunx nx run-many -t test --projects="$project_list" --verbose
          else
            echo "Aspire.AppHost.IntegrationTests is not affected; skipping."
          fi

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Filter Nx's affected graph first; run-many then executes exactly that selection.
      - name: Run architecture tests
        run: |
          projects=$(bunx nx show projects --affected --with-target=test --projects='*.Architecture.UnitTests' --json)
          project_list=$(jq -r 'join(",")' <<<"$projects")
          if [ -n "$project_list" ]; then
            bunx nx run-many -t test --projects="$project_list" --verbose
          else
            echo "No architecture test projects are affected; skipping."
          fi

  validate-specs:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'preview') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate OpenAPI specs
        run: |
          echo "TODO add Spectral validation when specs are populated"

  ci-gate:
    name: CI Gate
    if: always()
    needs: [check, aspire-integration-tests, architecture-tests, validate-specs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SPEC_VALIDATION_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'preview') || github.ref == 'refs/heads/main' }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          const expected = {
            check: "success",
            "aspire-integration-tests": "success",
            "architecture-tests": "success",
            "validate-specs": process.env.SPEC_VALIDATION_REQUIRED === "true" ? "success" : "skipped",
          };
          for (const [name, result] of Object.entries(expected)) {
            const actual = jobs[name]?.result ?? "missing";
            console.log(`${name}: ${actual} (required: ${result})`);
            if (actual !== result) process.exitCode = 1;
          }
          NODE
