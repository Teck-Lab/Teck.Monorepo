name: Reusable Build, Sign, and SBOM Generation (SLSA L3)

on:
  workflow_call:
    inputs:
      service-group:
        description: Service group (e.g. commerce)
        required: true
        type: string
      service-name:
        description: Service name (e.g. catalog)
        required: true
        type: string
      nx-project:
        description: Nx project name for the Host project
        required: true
        type: string
      project-path:
        description: Relative path to the Host .csproj
        required: true
        type: string
      version:
        description: Version to build (e.g. 1.0.0)
        required: true
        type: string
      source-ref:
        description: Git ref to build from (defaults to refs/tags/v<version>)
        required: false
        type: string
        default: ''
      publish-mode:
        description: 'Publish mode: release or staging'
        required: false
        type: string
        default: release
      staging-tag:
        description: Explicit staging tag when publish-mode=staging
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        description: GitHub token for authentication and release uploads
        required: true

permissions:
  contents: read

jobs:
  # WolverineFx codegen runs inside the image build (the Containerfile executes the
  # Host's `codegen write`), so no separate host-side codegen job is needed.
  build-and-push:
    name: Build ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.export-digest.outputs.digest }}
      image-name: ${{ steps.image-vars.outputs.image_name }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
      primary-tag: ${{ steps.image-vars.outputs.primary_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || format('refs/tags/v{0}', inputs.version) }}

      - name: Verify Containerfile template
        run: |
          test -f "deploy/Containerfile.template"
          test -d "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Prepare image variables
        id: image-vars
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
          VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode }}
          STAGING_TAG_INPUT: ${{ inputs.staging-tag }}
        run: |
          REPO_OWNER_LOWER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER_LOWER}/teck-monorepo/${SERVICE_GROUP}/${SERVICE_NAME}"
          PRIMARY_TAG="$VERSION"
          STAGING_TAG=""

          if [ "$PUBLISH_MODE" = "staging" ]; then
            STAGING_TAG="$STAGING_TAG_INPUT"
            if [ -z "$STAGING_TAG" ]; then
              STAGING_TAG="staging-${GITHUB_SHA}"
            fi
            PRIMARY_TAG="$STAGING_TAG"
          fi

          {
            echo "image_name=$IMAGE_NAME"
            echo "primary_tag=$PRIMARY_TAG"
            echo "staging_tag=$STAGING_TAG"
            echo "release_tag=${SERVICE_GROUP}@${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Build directly against the shared Containerfile template (this repo has no
      # per-project Dockerfiles, so @nx/docker infers no docker target). SERVICE_NAME
      # is the Host assembly name from the csproj filename (Catalog.Host,
      # Gateway.Public) - the template uses it directly for the dll/apphost, so it
      # works whether or not the project follows the `.Host` suffix convention.
      - name: Build and push image
        env:
          IMAGE_NAME: ${{ steps.image-vars.outputs.image_name }}
          PRIMARY_TAG: ${{ steps.image-vars.outputs.primary_tag }}
          PROJECT_PATH: ${{ inputs.project-path }}
          VERSION: ${{ inputs.version }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          PUBLISH_MODE: ${{ inputs.publish-mode }}
        run: |
          SERVICE_ASSEMBLY=$(basename "$PROJECT_PATH" .csproj)
          # Always multi-arch (preview/dev clusters may be arm64). Toggle only
          # ReadyToRun (crossgen2 AOT - the slow part): on for release, off for
          # preview/prerelease so they stay fast (IL-only, JIT at runtime) while still
          # producing images for both architectures.
          if [ "$PUBLISH_MODE" = "release" ]; then
            R2R="true"
          else
            R2R="false"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/Containerfile.template \
            --build-arg "SERVICE_NAME=${SERVICE_ASSEMBLY}" \
            --build-arg "PROJECT_PATH=${PROJECT_PATH}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "PUBLISH_READYTORUN=${R2R}" \
            --tag "${IMAGE_NAME}:${PRIMARY_TAG}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" \
            --label "com.teck.release.group=${SERVICE_GROUP}" \
            --label "com.teck.release.tag=${SERVICE_GROUP}@${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --metadata-file /tmp/build-meta.json \
            --push \
            .

      - name: Export digest
        id: export-digest
        run: |
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-meta.json)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Set image reference
        id: image-ref
        env:
          IMAGE_NAME: ${{ steps.image-vars.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.export-digest.outputs.digest }}
        run: echo "ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  scan-vulnerabilities:
    name: Scan ${{ inputs.service-group }}/${{ inputs.service-name }} vulnerabilities
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      # Trivy provides the direct image vulnerability scan and the JSON input used
      # by the VEX generator below. Results are kept as a build artifact; no external
      # SCA gate consumes them.
      - name: Run Trivy vulnerability scanner (JSON for VEX)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.github-token }}
        with:
          version: 'v0.69.3'
          image-ref: ${{ needs.build-and-push.outputs.image-ref }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: true

      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-scan-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: trivy-results.json
          retention-days: 90

      - name: Run Trivy vulnerability scanner (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.github-token }}
        with:
          version: 'v0.69.3'
          image-ref: ${{ needs.build-and-push.outputs.image-ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image findings to Code Scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Enforce fixable image vulnerability policy
        if: inputs.publish-mode == 'release'
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' trivy-results.json)
          if [ "$count" -gt 0 ]; then
            echo "Release image ${SERVICE_GROUP}/${SERVICE_NAME} has $count fixable HIGH/CRITICAL vulnerability finding(s)." >&2
            exit 1
          fi

  generate-sboms:
    name: Generate SBOMs for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
    outputs:
      spdx-sbom: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
      cyclonedx-sbom: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ needs.build-and-push.outputs.image-ref }}
          format: spdx-json
          output-file: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.github-token }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ needs.build-and-push.outputs.image-ref }}
          format: cyclonedx-json
          output-file: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.github-token }}

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
          retention-days: 90

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          retention-days: 90

  sign-sboms:
    name: Sign SBOMs for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-sboms]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-spdx-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign SPDX SBOM with Cosign
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          SPDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.spdx.json"
          cosign sign-blob --yes --bundle "${SPDX_FILE}.bundle" "$SPDX_FILE"
          jq -r '.messageSignature.signature' "${SPDX_FILE}.bundle" | base64 -d > "${SPDX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${SPDX_FILE}.bundle" | base64 -d > "${SPDX_FILE}.cert"

      - name: Sign CycloneDX SBOM with Cosign
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          CYCLONEDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.cyclonedx.json"
          cosign sign-blob --yes --bundle "${CYCLONEDX_FILE}.bundle" "$CYCLONEDX_FILE"
          jq -r '.messageSignature.signature' "${CYCLONEDX_FILE}.bundle" | base64 -d > "${CYCLONEDX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${CYCLONEDX_FILE}.bundle" | base64 -d > "${CYCLONEDX_FILE}.cert"

      - name: Verify SPDX SBOM signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          SPDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.spdx.json"
          cosign verify-blob \
            --bundle "${SPDX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$SPDX_FILE"

      - name: Verify CycloneDX SBOM signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          CYCLONEDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.cyclonedx.json"
          cosign verify-blob \
            --bundle "${CYCLONEDX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$CYCLONEDX_FILE"

  generate-vex:
    name: Generate VEX for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-sboms, scan-vulnerabilities]
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_GROUP: ${{ inputs.service-group }}
      SERVICE_NAME: ${{ inputs.service-name }}
      SERVICE_VERSION: ${{ inputs.version }}
      REPOSITORY_NAME: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
    steps:
      - name: Set image reference
        id: set-image
        run: |
          REPO_OWNER_LOWER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO_OWNER_LOWER}/teck-monorepo/${SERVICE_GROUP}/${SERVICE_NAME}@${IMAGE_DIGEST}"
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Download Trivy scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-scan-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Generate OpenVEX document
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cat > "$VEX_FILE" <<EOF
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://github.com/${REPOSITORY_NAME}/releases/download/v${SERVICE_VERSION}/${VEX_FILE}",
            "author": "Teck Build System",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "1",
            "tooling": "Trivy",
            "statements": []
          }
          EOF

          python3 - <<'PY'
          import json
          import os

          vex_file = f"vex-{os.environ['SERVICE_GROUP']}-{os.environ['SERVICE_NAME']}.openvex.json"
          image_ref = os.environ['IMAGE_REF']

          with open("trivy-results.json", encoding="utf-8") as file:
              trivy = json.load(file)

          with open(vex_file, encoding="utf-8") as file:
              vex = json.load(file)

          statements = []
          seen = set()
          for result in trivy.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  vuln_id = vuln.get("VulnerabilityID", "")
                  if not vuln_id or vuln_id in seen:
                      continue
                  seen.add(vuln_id)

                  fixed_version = vuln.get("FixedVersion")
                  status = "affected" if fixed_version else "under_investigation"

                  statement = {
                      "vulnerability": {"name": vuln_id},
                      "timestamp": vex["timestamp"],
                      "products": [{"component": {"id": image_ref}}],
                      "status": status,
                  }

                  if fixed_version:
                      statement["action_statement"] = f"Update to version {fixed_version} or later"

                  statements.append(statement)

          vex["statements"] = statements
          with open(vex_file, "w", encoding="utf-8") as file:
              json.dump(vex, file, indent=2)
          PY

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign VEX document
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cosign sign-blob --yes --bundle "${VEX_FILE}.bundle" "$VEX_FILE"
          jq -r '.messageSignature.signature' "${VEX_FILE}.bundle" | base64 -d > "${VEX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${VEX_FILE}.bundle" | base64 -d > "${VEX_FILE}.cert"

      - name: Verify VEX signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cosign verify-blob \
            --bundle "${VEX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$VEX_FILE"

      - name: Upload VEX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vex-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: |
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.sig
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.cert
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.bundle
          retention-days: 90

  sign-image:
    name: Sign ${{ inputs.service-group }}/${{ inputs.service-name }} image
    runs-on: ubuntu-latest
    # Image signing runs after build, scan, and SBOM generation complete. Unsigned
    # images are rejected by the downstream cosign-verify deploy policy.
    needs: [build-and-push, scan-vulnerabilities, generate-sboms]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Sign container image
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE_REF"

      # GitHub's native attestation API (actions/attest-*) is a paid feature for
      # private repos, so attach the SBOM to the image with cosign instead (keyless,
      # works on ghcr). Full SLSA build provenance would need that paid feature or a
      # public repo; the image is cosign-signed, which is what the deploy admission
      # policy verifies.
      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Attest SBOM to image (cosign)
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate "sbom-${SERVICE_GROUP}-${SERVICE_NAME}.cyclonedx.json" \
            "$IMAGE_REF"
