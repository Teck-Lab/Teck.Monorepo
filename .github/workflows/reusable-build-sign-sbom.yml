name: Reusable Build, Sign, and SBOM Generation (SLSA L3)

on:
  workflow_call:
    inputs:
      service-group:
        description: Service group (e.g. commerce)
        required: true
        type: string
      service-name:
        description: Service name (e.g. catalog)
        required: true
        type: string
      nx-project:
        description: Nx project name for the Host project
        required: true
        type: string
      project-path:
        description: Relative path to the Host .csproj
        required: true
        type: string
      version:
        description: Version to build (e.g. 1.0.0)
        required: true
        type: string
      source-ref:
        description: Git ref to build from (defaults to refs/tags/v<version>)
        required: false
        type: string
        default: ''
      publish-mode:
        description: 'Publish mode: release or staging'
        required: false
        type: string
        default: release
      staging-tag:
        description: Explicit staging tag when publish-mode=staging
        required: false
        type: string
        default: ''
      docker-context:
        description: Docker build context path
        required: false
        type: string
        default: '.'
      dockerfile-path:
        description: Path to the shared Containerfile template
        required: false
        type: string
        default: 'deploy/Containerfile.template'
    secrets:
      github-token:
        description: GitHub token for authentication and release uploads
        required: true
      secobserve-api-token:
        description: SecObserve user API token (Upload role) for importing image scan results
        required: true
      dependencytrack-api-key:
        description: Dependency Track API key for uploading the CycloneDX SBOM
        required: true

permissions:
  contents: read

jobs:
  generate-wolverine-codegen:
    name: Generate Wolverine code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || format('refs/tags/v{0}', inputs.version) }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Verify Host project path
        run: test -f "${{ inputs.project-path }}"

      - name: Restore Host project
        run: dotnet restore "${{ inputs.project-path }}" -r linux-x64

      - name: Run WolverineFx codegen target
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Logging__LogLevel__Grpc: Warning
        run: |
          dotnet msbuild "${{ inputs.project-path }}" \
            /t:WolverineCodegenWrite \
            /p:RunWolverineCodegen=true \
            /p:Configuration=Release

  build-and-push:
    name: Build ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [generate-wolverine-codegen]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.export-digest.outputs.digest }}
      image-name: ${{ steps.image-vars.outputs.image_name }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
      primary-tag: ${{ steps.image-vars.outputs.primary_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || format('refs/tags/v{0}', inputs.version) }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Containerfile template
        run: |
          test -f "${{ inputs.dockerfile-path }}"
          test -d "${{ inputs.docker-context }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Prepare image variables
        id: image-vars
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
          VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.publish-mode }}
          STAGING_TAG_INPUT: ${{ inputs.staging-tag }}
        run: |
          REPO_OWNER_LOWER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER_LOWER}/teck-monorepo/${SERVICE_GROUP}/${SERVICE_NAME}"
          PRIMARY_TAG="$VERSION"
          STAGING_TAG=""

          if [ "$PUBLISH_MODE" = "staging" ]; then
            STAGING_TAG="$STAGING_TAG_INPUT"
            if [ -z "$STAGING_TAG" ]; then
              STAGING_TAG="staging-${GITHUB_SHA}"
            fi
            PRIMARY_TAG="$STAGING_TAG"
          fi

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$STAGING_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=${SERVICE_GROUP}@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push image with Nx
        env:
          IMAGE_NAME: ${{ steps.image-vars.outputs.image_name }}
          PRIMARY_TAG: ${{ steps.image-vars.outputs.primary_tag }}
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          SERVICE_ASSEMBLY=$(basename "$(dirname "$PROJECT_PATH")" | sed 's/\.Host$//')
          bunx nx run "${{ inputs.nx-project }}:docker:build" -- \
            --tag "${IMAGE_NAME}:${PRIMARY_TAG}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" \
            --build-arg "SERVICE_NAME=${SERVICE_ASSEMBLY}" \
            --build-arg "PROJECT_PATH=${{ inputs.project-path }}" \
            --build-arg "VERSION=${{ inputs.version }}" \
            --build-arg "SERVICE_GROUP=${{ inputs.service-group }}" \
            --label "com.teck.release.group=${{ inputs.service-group }}" \
            --label "com.teck.release.tag=${{ inputs.service-group }}@${{ inputs.version }}"

      - name: Export digest
        id: export-digest
        env:
          IMAGE_NAME: ${{ steps.image-vars.outputs.image_name }}
          PRIMARY_TAG: ${{ steps.image-vars.outputs.primary_tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${PRIMARY_TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Set image reference
        id: image-ref
        env:
          IMAGE_NAME: ${{ steps.image-vars.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.export-digest.outputs.digest }}
        run: echo "ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  scan-vulnerabilities:
    name: Scan ${{ inputs.service-group }}/${{ inputs.service-name }} vulnerabilities
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      # NOTE: gating no longer fails the build here. CRITICAL/HIGH severity is
      # enforced by SecObserve's security gate (see check_security_gate). Results
      # go to SecObserve, not the GitHub Security tab.
      - name: Run Trivy vulnerability scanner (CycloneDX for SecObserve)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.github-token }}
        with:
          version: 'v0.69.3'
          image-ref: ${{ needs.build-and-push.outputs.image-ref }}
          format: 'cyclonedx'
          output: 'trivy-image-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json'
          scanners: 'vuln'

      - name: Import Trivy results into SecObserve
        uses: SecObserve/secobserve_actions_templates/actions/upload_observations@51571f8cbc46bdcf11bdf3d45e1608c86a10bd08 # v2026_06
        with:
          so_api_base_url: ${{ vars.SECOBSERVE_API_BASE_URL }}
          so_api_token: ${{ secrets.secobserve-api-token }}
          so_product_name: ${{ vars.SECOBSERVE_PRODUCT_NAME }}
          so_branch_name: ${{ inputs.version }}
          so_file_name: trivy-image-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          so_origin_service: ${{ inputs.service-group }}/${{ inputs.service-name }}
          so_origin_docker_image_name_tag: ${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.primary-tag }}

      - name: Run Trivy vulnerability scanner (JSON for VEX)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.github-token }}
        with:
          version: 'v0.69.3'
          image-ref: ${{ needs.build-and-push.outputs.image-ref }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: true

      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-scan-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: trivy-results.json
          retention-days: 90

  security-gate:
    name: SecObserve release gate for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [scan-vulnerabilities]
    permissions:
      contents: read
    steps:
      # Release gate: fails the build (and therefore the release pipeline) when the
      # SecObserve product's security gate is red. Evaluates observations already
      # imported into SecObserve (the image scan above). Dependency Track findings are
      # pulled into SecObserve asynchronously by its server-side DT integration, so
      # they are enforced by SecObserve continuously rather than at this exact step.
      # NOTE: the gate is product-level. With a single shared product, an unresolved
      # finding in one service can block another service's release - split into
      # per-service SecObserve products if you need independent release gating.
      - name: Check SecObserve security gate
        uses: SecObserve/secobserve_actions_templates/actions/check_security_gate@51571f8cbc46bdcf11bdf3d45e1608c86a10bd08 # v2026_06
        with:
          so_api_base_url: ${{ vars.SECOBSERVE_API_BASE_URL }}
          so_api_token: ${{ secrets.secobserve-api-token }}
          so_product_name: ${{ vars.SECOBSERVE_PRODUCT_NAME }}

  generate-sboms:
    name: Generate SBOMs for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
      packages: read
    outputs:
      spdx-sbom: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
      cyclonedx-sbom: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ needs.build-and-push.outputs.image-ref }}
          format: spdx-json
          output-file: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.github-token }}
          dependency-snapshot: true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          image: ${{ needs.build-and-push.outputs.image-ref }}
          format: cyclonedx-json
          output-file: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.github-token }}

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json
          retention-days: 90

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          retention-days: 90

  upload-sbom-dependency-track:
    name: Upload SBOM to Dependency Track for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [generate-sboms]
    permissions:
      contents: read
    steps:
      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}

      # Dependency Track becomes the SCA engine + SBOM registry: it re-scans stored
      # SBOMs continuously as new advisories land, and SecObserve imports its findings
      # via the server-side Dependency Track integration.
      - name: Upload CycloneDX SBOM to Dependency Track
        uses: DependencyTrack/gh-upload-sbom@cc655d7447ad82945e0034afbd67cd8f571f11b0 # v4.1.0
        with:
          serverhostname: ${{ vars.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.dependencytrack-api-key }}
          projectname: ${{ inputs.service-group }}/${{ inputs.service-name }}
          projectversion: ${{ inputs.version }}
          projecttags: ${{ inputs.service-group }}
          bomfilename: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.cyclonedx.json
          autocreate: 'true'
          isLatest: ${{ inputs.publish-mode == 'release' && 'true' || 'false' }}

  sign-sboms:
    name: Sign SBOMs for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-sboms]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-spdx-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign SPDX SBOM with Cosign
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          SPDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.spdx.json"
          cosign sign-blob --yes --bundle "${SPDX_FILE}.bundle" "$SPDX_FILE"
          jq -r '.messageSignature.signature' "${SPDX_FILE}.bundle" | base64 -d > "${SPDX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${SPDX_FILE}.bundle" | base64 -d > "${SPDX_FILE}.cert"

      - name: Sign CycloneDX SBOM with Cosign
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          CYCLONEDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.cyclonedx.json"
          cosign sign-blob --yes --bundle "${CYCLONEDX_FILE}.bundle" "$CYCLONEDX_FILE"
          jq -r '.messageSignature.signature' "${CYCLONEDX_FILE}.bundle" | base64 -d > "${CYCLONEDX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${CYCLONEDX_FILE}.bundle" | base64 -d > "${CYCLONEDX_FILE}.cert"

      - name: Verify SPDX SBOM signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          SPDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.spdx.json"
          cosign verify-blob \
            --bundle "${SPDX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$SPDX_FILE"

      - name: Verify CycloneDX SBOM signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          CYCLONEDX_FILE="sbom-${SERVICE_GROUP}-${SERVICE_NAME}.cyclonedx.json"
          cosign verify-blob \
            --bundle "${CYCLONEDX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$CYCLONEDX_FILE"

      - name: Attest SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.build-and-push.outputs.image-name }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          sbom-path: sbom-${{ inputs.service-group }}-${{ inputs.service-name }}.spdx.json

  generate-vex:
    name: Generate VEX for ${{ inputs.service-group }}/${{ inputs.service-name }}
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-sboms, scan-vulnerabilities]
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_GROUP: ${{ inputs.service-group }}
      SERVICE_NAME: ${{ inputs.service-name }}
      SERVICE_VERSION: ${{ inputs.version }}
      REPOSITORY_NAME: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
    steps:
      - name: Set image reference
        id: set-image
        run: |
          REPO_OWNER_LOWER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO_OWNER_LOWER}/teck-monorepo/${SERVICE_GROUP}/${SERVICE_NAME}@${IMAGE_DIGEST}"
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Download Trivy scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-scan-${{ inputs.service-group }}-${{ inputs.service-name }}

      - name: Generate OpenVEX document
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cat > "$VEX_FILE" <<EOF
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://github.com/${REPOSITORY_NAME}/releases/download/v${SERVICE_VERSION}/${VEX_FILE}",
            "author": "Teck Build System",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "1",
            "tooling": "Trivy",
            "statements": []
          }
          EOF

          python3 - <<'PY'
          import json
          import os

          vex_file = f"vex-{os.environ['SERVICE_GROUP']}-{os.environ['SERVICE_NAME']}.openvex.json"
          image_ref = os.environ['IMAGE_REF']

          with open("trivy-results.json", encoding="utf-8") as file:
              trivy = json.load(file)

          with open(vex_file, encoding="utf-8") as file:
              vex = json.load(file)

          statements = []
          seen = set()
          for result in trivy.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  vuln_id = vuln.get("VulnerabilityID", "")
                  if not vuln_id or vuln_id in seen:
                      continue
                  seen.add(vuln_id)

                  fixed_version = vuln.get("FixedVersion")
                  status = "affected" if fixed_version else "under_investigation"

                  statement = {
                      "vulnerability": {"name": vuln_id},
                      "timestamp": vex["timestamp"],
                      "products": [{"component": {"id": image_ref}}],
                      "status": status,
                  }

                  if fixed_version:
                      statement["action_statement"] = f"Update to version {fixed_version} or later"

                  statements.append(statement)

          vex["statements"] = statements
          with open(vex_file, "w", encoding="utf-8") as file:
              json.dump(vex, file, indent=2)
          PY

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign VEX document
        env:
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cosign sign-blob --yes --bundle "${VEX_FILE}.bundle" "$VEX_FILE"
          jq -r '.messageSignature.signature' "${VEX_FILE}.bundle" | base64 -d > "${VEX_FILE}.sig"
          jq -r '.verificationMaterial.certificate.rawBytes' "${VEX_FILE}.bundle" | base64 -d > "${VEX_FILE}.cert"

      - name: Verify VEX signature
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          SERVICE_GROUP: ${{ inputs.service-group }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          VEX_FILE="vex-${SERVICE_GROUP}-${SERVICE_NAME}.openvex.json"
          cosign verify-blob \
            --bundle "${VEX_FILE}.bundle" \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$VEX_FILE"

      - name: Upload VEX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vex-${{ inputs.service-group }}-${{ inputs.service-name }}
          path: |
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.sig
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.cert
            vex-${{ inputs.service-group }}-${{ inputs.service-name }}.openvex.json.bundle
          retention-days: 90

  sign-image:
    name: Sign ${{ inputs.service-group }}/${{ inputs.service-name }} image
    runs-on: ubuntu-latest
    # security-gate gates signing: a red SecObserve gate leaves the image unsigned,
    # so the downstream cosign-verify deploy policy rejects it.
    needs: [build-and-push, scan-vulnerabilities, security-gate]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Sign container image
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY_NAME}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE_REF"

      - name: Generate build provenance attestation (SLSA L3)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ needs.build-and-push.outputs.image-name }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          push-to-registry: true
