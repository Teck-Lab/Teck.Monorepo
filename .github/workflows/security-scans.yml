name: Security Scans
on:
  pull_request:
    branches: [main, alpha, beta, next]
  push:
    branches: [main, alpha, beta, next]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

# Findings go to GitHub Advanced Security: Semgrep SARIF -> code scanning (one
# category per service), frontend SBOM -> dependency graph (correlator
# sbom/frontend), dependency-review gates PRs on new HIGH+ dependencies.
# Gitleaks is the repo-wide secrets hard gate and stays CI-fail-only.
# Per-service topology (see .github/scripts/discover-services.sh):
#   code-scanning category = the `product` field; release groups can be shared.
# No external security services or secrets are required.
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse CodeQL instead of a second independently triggered workflow. The caller's
  # result includes every language in its matrix, so Security Gate can depend on it.
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml

  workflow-security:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout workflows without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  configuration-security:
    name: IaC and configuration security (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@18df1a6e2a79af02113f3db2faaf18d350ea82d # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
      - name: Upload configuration findings
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  discover-services:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for any script that needs to diff the PR against base.
          fetch-depth: 0

      # GitHub's native code-scanning rule compares categories on main with the
      # PR merge ref. During the public-gateway cutover, main still has the
      # semgrep-gateway-public category. Preserve it as a scan-only matrix entry
      # that covers both replacement hosts and the shared edge library.
      # Every deployable service retains its own category as before.
      - name: Discover services
        id: discover
        run: |
          services=$(bash .github/scripts/discover-services.sh --semgrep-matrix | jq 'map(.scanPaths //= [.scanPath])')
          count=$(echo "$services" | jq 'length')
          echo "matrix=$(echo "$services" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-services=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Discovered $count Semgrep scan(s):"; echo "$services" | jq -r '.[].product'

  semgrep:
    name: Semgrep SAST (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover-services
    if: needs.discover-services.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # Python 3.12 no longer bundles setuptools, and Semgrep's transitive
        # opentelemetry dependency imports pkg_resources - which setuptools 81 REMOVED.
        # Pin setuptools < 81 so pkg_resources is available.
        run: pip install "setuptools<81" semgrep==1.97.0

      # Run Semgrep ourselves (native, pinned, controlled environment) to avoid the
      # OCaml crash that intermittently aborts containerized runners with unlimited
      # RLIMIT_STACK. Scans this service plus src/shared (SharedKernel is compiled
      # into every service, so a flaw there is a real finding for each service's
      # product). Exits 0 on findings (--error is NOT set); the merge gate is the
      # branch-protection code-scanning rule.
      - name: Run Semgrep (SARIF)
        run: |
          # Bound the stack so OCaml never sees an unlimited RLIMIT_STACK (the root of
          # the scanner-image crash); native runners default to 8 MB, this just makes it
          # deterministic.
          ulimit -s 8192 || true
          semgrep scan \
            --config p/csharp \
            --config p/secrets \
            --config p/r2c-security-audit \
            --sarif --output "semgrep-${{ matrix.product }}.sarif" \
            --metrics=off \
            ${{ join(matrix.scanPaths, ' ') }} src/shared

      # Sink = GHAS code scanning. category keeps the per-service split; alerts
      # annotate PRs and land in the Security tab. Semgrep exits 0 on findings;
      # the merge gate is the branch-protection code-scanning rule.
      - name: Upload Semgrep results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        if: always()
        with:
          sarif_file: semgrep-${{ matrix.product }}.sarif
          category: semgrep-${{ matrix.product }}

  # Source-level SCA: dependency graph (native manifests + submitted SBOMs) +
  # Dependabot alerts/fix PRs. GitHub merge protection gates new dependency and
  # SAST risk before main. The release reusable workflow produces direct Trivy
  # reports and VEX; it does not rely on an external release-time image gate.

  dependency-review:
    name: Dependency Review (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  gitleaks:
    name: Gitleaks Secret Detection (CI gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        # Repo-wide, over full history. Fails CI on any finding. A leaked secret
        # is a repo incident (rotate + purge history) that maps to no single
        # service product.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --exit-code=1 --verbose

  frontend-audit:
    # Frontend dependency SCA. Quick PR-time coverage for the workspace.
    name: Frontend dependency audit (informational)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run npm audit (HIGH+)
        run: npm audit --audit-level=high --json > npm-audit.json || true
      - name: Print audit summary
        run: |
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("npm-audit.json","utf8"));
            const v = d.metadata?.vulnerabilities || {};
            console.log(`HIGH: ${v.high||0}  CRITICAL: ${v.critical||0}`);
          '

  frontend-sbom:
    # SBOMs for all frontend workspaces (web, dashboard, mobile, packages).
    name: Frontend SBOM (submit to dependency graph)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cdxgen -o frontend-sbom.cdx.json .
      - name: Upload SBOM to dependency graph
        uses: advanced-security/sbom-action@58340476a9478ff5aab2517cb06dc86e5288de7 # v0.2.0
        with:
          path: frontend-sbom.cdx.json
          correlator: sbom/frontend

  security-gate:
    name: Security Gate
    if: always()
    needs: [codeql, workflow-security, configuration-security, discover-services, semgrep, dependency-review, gitleaks, frontend-audit, frontend-sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Verify security prerequisites
        env:
          PR_EVENT: ${{ github.event_name == 'pull_request' }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
          CONFIGURATION_SECURITY_RESULT: ${{ needs.configuration-security.result }}
          DISCOVERY_RESULT: ${{ needs.discover-services.result }}
          HAS_SERVICES: ${{ needs.discover-services.outputs.has-services }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          FRONTEND_AUDIT_RESULT: ${{ needs.frontend-audit.result }}
          FRONTEND_SBOM_RESULT: ${{ needs.frontend-sbom.result }}
        run: |
          set -euo pipefail
          test "$CODEQL_RESULT" = success
          test "$WORKFLOW_SECURITY_RESULT" = success
          test "$CONFIGURATION_SECURITY_RESULT" = success
          test "$DISCOVERY_RESULT" = success
          if [ "$HAS_SERVICES" = true ]; then
            test "$SEMGREP_RESULT" = success
          else
            test "$SEMGREP_RESULT" = skipped
          fi
          test "$GITLEAKS_RESULT" = success
          if [ "$PR_EVENT" = true ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
            test "$FRONTEND_AUDIT_RESULT" = skipped
            test "$FRONTEND_SBOM_RESULT" = skipped
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
            test "$FRONTEND_AUDIT_RESULT" = success
            test "$FRONTEND_SBOM_RESULT" = success
          fi
