name: Security Scans
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  workflow_call:

# Findings are imported into SecObserve, which is the single vulnerability-management
# console. Nothing is written to the GitHub code-scanning / Security tab.
#
# Topology (see docs and .github/scripts/discover-services.sh):
#   SecObserve Product Group = repository, Product = service, release-group = a tag.
# Each backend service is its own SecObserve Product, so source scans import per
# service and the release gate is per service. Gitleaks is the one exception: it is
# repo-wide (git history has no service) and stays a CI-fail-only gate - its results
# are NOT exported to SecObserve.
#
# Required config (repo or org level):
#   vars.SECOBSERVE_API_BASE_URL    - SecObserve backend URL
#   secrets.SECOBSERVE_API_TOKEN    - SecObserve user API token with the Upload role
#   vars.DEPENDENCYTRACK_HOSTNAME   - Dependency Track hostname (frontend SBOM upload)
#   secrets.DEPENDENCYTRACK_API_KEY - Dependency Track API key (frontend SBOM upload)
# Each backend service must have a matching SecObserve Product (name == the `product`
# field emitted by discover-services.sh, e.g. order, pricing, gateway-public).
# The frontend has NO SecObserve product yet: its SBOM goes to Dependency Track only
# (aggregate project), so no throwaway product is created before the per-app split.
# See .github/scripts/discover-frontend.sh for the prepared per-app naming.
permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  SO_API_BASE_URL: ${{ vars.SECOBSERVE_API_BASE_URL }}
  SO_BRANCH_NAME: ${{ github.ref_name }}

jobs:
  discover-services:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so nx-affected can diff PRs against the base.
          fetch-depth: 0

      # On PRs, scan only services affected by the diff (the "only touch what changed"
      # principle). On push/schedule/dispatch, scan every service for full coverage.
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request'
      - name: Install dependencies (for nx affected)
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Discover services
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fall back to scanning all services if affected detection fails.
            affected=$(bunx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>/dev/null || echo "")
            [ -n "$affected" ] && export NX_AFFECTED="$affected"
          fi
          services=$(.github/scripts/discover-services.sh)
          count=$(echo "$services" | jq 'length')
          echo "matrix=$(echo "$services" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-services=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Discovered $count service(s):"; echo "$services" | jq -r '.[].product'

  semgrep:
    name: Semgrep SAST (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover-services
    if: needs.discover-services.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Scans this service plus src/shared (SharedKernel is compiled into every service,
      # so a flaw there is a real finding for each service's product).
      # The SecObserve scanner image's Semgrep (OCaml 5) intermittently crashes at
      # startup with "Failed to allocate signal stack for domain 0" - a runner/ulimit
      # flake (~1 in 6, unrelated to our code and to what is scanned). It crashes before
      # scanning/uploading, so a plain retry is safe. Attempt once, then retry on failure.
      - name: Semgrep scan + import to SecObserve (attempt 1)
        id: semgrep
        continue-on-error: true
        uses: SecObserve/secobserve_actions_templates/actions/SAST/semgrep@51571f8cbc46bdcf11bdf3d45e1608c86a10bd08 # v2026_06
        with:
          target: ${{ matrix.scanPath }}
          report_name: semgrep-${{ matrix.product }}.sarif
          configuration: p/csharp
          further_parameters: >-
            --config p/secrets
            --config p/r2c-security-audit
            src/shared
          so_api_base_url: ${{ env.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SECOBSERVE_API_TOKEN }}
          so_product_name: ${{ matrix.product }}
          so_branch_name: ${{ env.SO_BRANCH_NAME }}
          so_origin_service: ${{ matrix.group }}/${{ matrix.service }}

      - name: Semgrep scan + import to SecObserve (retry)
        if: steps.semgrep.outcome == 'failure'
        uses: SecObserve/secobserve_actions_templates/actions/SAST/semgrep@51571f8cbc46bdcf11bdf3d45e1608c86a10bd08 # v2026_06
        with:
          target: ${{ matrix.scanPath }}
          report_name: semgrep-${{ matrix.product }}.sarif
          configuration: p/csharp
          further_parameters: >-
            --config p/secrets
            --config p/r2c-security-audit
            src/shared
          so_api_base_url: ${{ env.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SECOBSERVE_API_TOKEN }}
          so_product_name: ${{ matrix.product }}
          so_branch_name: ${{ env.SO_BRANCH_NAME }}
          so_origin_service: ${{ matrix.group }}/${{ matrix.service }}

  # Dependency SCA is intentionally NOT run here: Dependency Track owns SCA (it scans
  # each service's image SBOM continuously and feeds SecObserve via the DT integration).
  # PR-time dependency risk is covered by dependency-review below; a source-level SCA
  # here would duplicate DT. SecObserve therefore receives only SAST (Semgrep) directly.

  gitleaks:
    name: Gitleaks Secret Detection (CI gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        # Repo-wide, over full history. Fails CI on any finding. Results are NOT
        # exported to SecObserve: a leaked secret is a repo incident (rotate + purge
        # history) that maps to no single service product. Run directly (not via the
        # SecObserve gitleaks action) precisely so nothing is uploaded.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --exit-code=1 --verbose

  # No GitHub-native dependency-review job: it requires GitHub Advanced Security +
  # Dependency Graph, which this repo doesn't have, and dependency SCA lives in
  # Dependency Track (fed by the per-service image SBOMs + the frontend SBOM). Re-add
  # actions/dependency-review-action here if GHAS is ever enabled and you want a
  # PR-time new-dependency gate on top of DT.

  frontend-audit:
    # Frontend dependency SCA. Frontend SBOMs are not yet pushed to Dependency Track
    # per app (only the aggregate below is), so this remains quick PR-time coverage.
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Audit frontend dependencies
        run: bun audit || true

  frontend-sbom:
    # Frontend SCA + licenses. Generates one CycloneDX SBOM for the whole Bun workspace
    # from the root bun.lock and sends it to Dependency Track only (continuous re-scan +
    # license policy). Runs off-PR to avoid churning DT project versions; PR-time
    # frontend SCA is covered by dependency-review above.
    #
    # Trivy parses bun.lock reliably; cdxgen@11 does NOT for this lockfileVersion (it
    # yields an empty BOM), so Trivy is the engine here.
    #
    # AGGREGATE Dependency Track project 'frontend', tagged 'web'. Deliberately NOT
    # imported into SecObserve yet: per-app SBOMs are not meaningful while nearly all
    # frontend dependencies are declared in the ROOT package.json (not per app), and an
    # aggregate SecObserve product would only have to be retired at the per-app split.
    # When apps declare their own deps, wire .github/scripts/discover-frontend.sh into a
    # per-app SBOM job and create the per-app SecObserve products then (created once).
    name: Frontend SBOM (SCA -> Dependency Track)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Isolate the workspace lockfile for a fast SBOM
        # Scanning the repo root would also walk node_modules and the .NET tree; the
        # root bun.lock alone encodes the full frontend dependency graph.
        run: |
          mkdir -p .frontend-sbom
          cp bun.lock package.json .frontend-sbom/

      - name: Generate CycloneDX SBOM from bun.lock (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: fs
          scan-ref: .frontend-sbom
          format: cyclonedx
          output: sbom-frontend.cyclonedx.json
          scanners: license

      - name: Upload frontend SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend-cyclonedx
          path: sbom-frontend.cyclonedx.json
          retention-days: 90

      - name: Upload SBOM to Dependency Track
        uses: DependencyTrack/gh-upload-sbom@cc655d7447ad82945e0034afbd67cd8f571f11b0 # v4.1.0
        with:
          serverhostname: ${{ vars.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: frontend
          projectversion: ${{ github.ref_name }}
          projecttags: web
          bomfilename: sbom-frontend.cyclonedx.json
          autocreate: 'true'
          isLatest: ${{ github.ref_name == github.event.repository.default_branch && 'true' || 'false' }}

  security-gate:
    # Merge gate: fails the PR when any affected service's SecObserve product gate is
    # red after Semgrep (SAST) imports. Each service is its own product, so the gate is
    # per service. This is the SAST/merge gate; the dependency (SCA) release gate lives
    # in Dependency Track on the release/RC path, not here.
    name: SecObserve Merge Gate (${{ matrix.product }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.discover-services.outputs.has-services == 'true'
    needs: [discover-services, semgrep]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.matrix) }}
    steps:
      - name: Check SecObserve security gate
        uses: SecObserve/secobserve_actions_templates/actions/check_security_gate@51571f8cbc46bdcf11bdf3d45e1608c86a10bd08 # v2026_06
        with:
          so_api_base_url: ${{ env.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SECOBSERVE_API_TOKEN }}
          so_product_name: ${{ matrix.product }}
          so_branch_name: ${{ env.SO_BRANCH_NAME }}
