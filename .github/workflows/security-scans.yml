name: Security Scans
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  workflow_call:

# Findings go to GitHub Advanced Security: Semgrep SARIF -> code scanning (one
# category per service), frontend SBOM -> dependency graph (correlator
# sbom/frontend), dependency-review gates PRs on new HIGH+ dependencies.
# Gitleaks is the repo-wide secrets hard gate and stays CI-fail-only.
# Per-service topology (see .github/scripts/discover-services.sh):
#   code-scanning category = nx release group = the `product` field.
# No external security services or secrets are required.
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scans-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  discover-services:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so nx-affected can diff PRs against the base.
          fetch-depth: 0

      # On PRs, scan only services affected by the diff (the "only touch what changed"
      # principle). On push/schedule/dispatch, scan every service for full coverage.
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request'
      - name: Install dependencies (for nx affected)
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Discover services
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fall back to scanning all services if affected detection fails.
            affected=$(bunx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>/dev/null || echo "")
            [ -n "$affected" ] && export NX_AFFECTED="$affected"
          fi
          services=$(.github/scripts/discover-services.sh)
          count=$(echo "$services" | jq 'length')
          echo "matrix=$(echo "$services" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-services=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Discovered $count service(s):"; echo "$services" | jq -r '.[].product'

  semgrep:
    name: Semgrep SAST (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover-services
    if: needs.discover-services.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # Python 3.12 no longer bundles setuptools, and Semgrep's transitive
        # opentelemetry dependency imports pkg_resources - which setuptools 81 REMOVED.
        # Pin setuptools < 81 so pkg_resources is available.
        run: pip install "setuptools<81" semgrep==1.97.0

      # Run Semgrep ourselves (native, pinned, controlled environment) to avoid the
      # OCaml crash that intermittently aborts containerized runners with unlimited
      # RLIMIT_STACK. Scans this service plus src/shared (SharedKernel is compiled
      # into every service, so a flaw there is a real finding for each service's
      # product). Exits 0 on findings (--error is NOT set); the merge gate is the
      # branch-protection code-scanning rule.
      - name: Run Semgrep (SARIF)
        run: |
          # Bound the stack so OCaml never sees an unlimited RLIMIT_STACK (the root of
          # the scanner-image crash); native runners default to 8 MB, this just makes it
          # deterministic.
          ulimit -s 8192 || true
          semgrep scan \
            --config p/csharp \
            --config p/secrets \
            --config p/r2c-security-audit \
            --sarif --output "semgrep-${{ matrix.product }}.sarif" \
            --metrics=off \
            "${{ matrix.scanPath }}" src/shared

      # Sink = GHAS code scanning. category keeps the per-service split; alerts
      # annotate PRs and land in the Security tab. Semgrep exits 0 on findings;
      # the merge gate is the branch-protection code-scanning rule.
      - name: Upload Semgrep results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep-${{ matrix.product }}.sarif
          category: semgrep-${{ matrix.product }}

  # Source-level SCA: dependency graph (native manifests + submitted SBOMs) +
  # Dependabot alerts/fix PRs. GitHub merge protection gates new dependency and
  # SAST risk before main. The release reusable workflow produces direct Trivy
  # reports and VEX; it does not rely on an external release-time image gate.

  dependency-review:
    name: Dependency Review (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high


  gitleaks:
    name: Gitleaks Secret Detection (CI gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        # Repo-wide, over full history. Fails CI on any finding. A leaked secret
        # is a repo incident (rotate + purge history) that maps to no single
        # service product.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --exit-code=1 --verbose


  frontend-audit:
    # Frontend dependency SCA. Quick PR-time coverage for the aggregate workspace.
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Audit frontend dependencies
        run: bun audit || true

  frontend-sbom:
    # Frontend SCA + licenses. One CycloneDX SBOM for the whole Bun workspace
    # from the root bun.lock, submitted to the GitHub dependency graph
    # (correlator sbom/frontend) so Dependabot alerts cover frontend deps.
    # Runs off-PR; PR-time coverage is dependency-review above.
    #
    # Trivy parses bun.lock reliably; cdxgen@11 does NOT for this lockfileVersion
    # (it yields an empty BOM), so Trivy is the engine here.
    #
    # Per-app SBOMs stay deferred exactly as before: wire
    # .github/scripts/discover-frontend.sh into a per-app job when apps declare
    # their own deps (correlators web/<app>).
    name: Frontend SBOM (SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Isolate the workspace lockfile for a fast SBOM
        # Scanning the repo root would also walk node_modules and the .NET tree; the
        # root bun.lock alone encodes the full frontend dependency graph.
        run: |
          mkdir -p .frontend-sbom
          cp bun.lock package.json .frontend-sbom/

      - name: Generate CycloneDX SBOM from bun.lock (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: fs
          scan-ref: .frontend-sbom
          format: cyclonedx
          output: sbom-frontend.cyclonedx.json
          scanners: license

      - name: Upload frontend SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend-cyclonedx
          path: sbom-frontend.cyclonedx.json
          retention-days: 90

      - name: Submit frontend SBOM to the dependency graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/submit-sbom-dependency-graph.sh sbom-frontend.cyclonedx.json sbom/frontend
