name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Maintain the Nx release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-releases: ${{ steps.manifest.outputs.has-releases }}
      matrix: ${{ steps.manifest.outputs.matrix }}
      release-head: ${{ steps.cpr.outputs.pull-request-head-sha }}

    steps:
      - name: Mint the Teck Automation GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect pending Version Plans
        id: plans
        shell: bash
        run: |
          if compgen -G '.nx/version-plans/*.md' >/dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No pending Nx Version Plans; no release PR update is needed.'
          fi

      - name: Resolve versions and changelogs with Nx
        if: steps.plans.outputs.found == 'true'
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: bun run release:prepare

      - name: Export release matrix
        id: manifest
        if: steps.plans.outputs.found == 'true'
        shell: bash
        run: |
          test -s .nx/releases/manifest.json
          echo "matrix=$(jq -c '{include: .releases}' .nx/releases/manifest.json)" >> "$GITHUB_OUTPUT"
          echo 'has-releases=true' >> "$GITHUB_OUTPUT"

      - name: Create or update the signed release PR
        id: cpr
        if: steps.plans.outputs.found == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: release/nx
          base: main
          delete-branch: true
          commit-message: 'chore(release): publish planned releases'
          title: 'chore(release): publish planned releases'
          body: |
            Nx generated this release PR from the Version Plans currently on `main`.

            - Package manifests are updated where the Nx ecosystem supports them.
            - .NET versions are supplied at build time and are not hard-coded into project files.
            - Merging this PR promotes the exact canary image digests and publishes the matching draft releases.
          labels: |
            autorelease: pending

  draft:
    name: Draft ${{ matrix.name }}@v${{ matrix.version }}
    needs: prepare
    if: needs.prepare.outputs.has-releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Mint the Teck Automation GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release-head }}

      - name: Read the Nx changelog
        id: notes
        shell: bash
        env:
          NOTES_FILE: ${{ matrix.notesFile }}
        run: |
          delimiter="NX_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "value<<$delimiter"
            cat "$NOTES_FILE"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the stable draft
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-name: ${{ matrix.configName }}
          name: '${{ matrix.name }} v${{ matrix.version }}'
          tag: ${{ matrix.tag }}
          version: ${{ matrix.version }}
          from: ${{ matrix.previousTag }}
          commitish: ${{ github.sha }}
          header: ${{ steps.notes.outputs.value }}
          publish: false
          prerelease: false
          latest: false
  stable-plan:
    name: Read the merged release manifest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/nx'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Export the stable release matrix
        id: manifest
        shell: bash
        run: |
          test -s .nx/releases/manifest.json
          echo "matrix=$(jq -c '{include: .releases}' .nx/releases/manifest.json)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}@v${{ matrix.version }}
    needs: stable-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stable-plan.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Mint the Teck Automation GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: write
          permission-pull-requests: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f00e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote immutable candidate image manifests
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ format('{0}-canary.{1}', matrix.version, matrix.sourceSha) }}
          RELEASE_GROUP: ${{ matrix.releaseGroup }}
          RELEASE_VERSION: ${{ matrix.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          services=$(./.github/scripts/discover-services.sh)
          images=$(jq -r --arg owner "$owner" --arg group "$RELEASE_GROUP" '
            .[] | select(.releaseGroup == $group) |
            "ghcr.io/\($owner)/teck-monorepo/\(.group)/\(.service)"
          ' <<< "$services")

          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            source_digest=$(docker buildx imagetools inspect "$image:$CANDIDATE_VERSION" |
              awk '$1 == "Digest:" { print $2; exit }')
            test -n "$source_digest"
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:$RELEASE_VERSION" --tag "$image:latest" "$image@$source_digest"
            stable_digest=$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" |
              awk '$1 == "Digest:" { print $2; exit }')
            test "$stable_digest" = "$source_digest"
          done <<< "$images"

      - name: Read the Nx changelog
        id: notes
        shell: bash
        env:
          NOTES_FILE: ${{ matrix.notesFile }}
        run: |
          delimiter="NX_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "value<<$delimiter"
            cat "$NOTES_FILE"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the existing stable draft
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-name: ${{ matrix.configName }}
          name: '${{ matrix.name }} v${{ matrix.version }}'
          tag: ${{ matrix.tag }}
          version: ${{ matrix.version }}
          from: ${{ matrix.previousTag }}
          commitish: ${{ github.event.pull_request.merge_commit_sha }}
          header: ${{ steps.notes.outputs.value }}
          publish: true
          prerelease: false
          latest: false
