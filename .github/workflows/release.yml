name: Release

on:
  workflow_run:
    workflows: [CI, Security Scans]
    types: [completed]
    branches: [main, alpha, beta, next]

permissions:
  contents: read

# Versions and immutable tags share one repository-wide release lock.
concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the validated platform release
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      has-releases: ${{ steps.versions.outputs.has-releases }}
      has-services: ${{ steps.matrix.outputs.has-services }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Require both workflows for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/release-gate.mjs

      - name: Mint the Teck Automation GitHub App token
        if: steps.gate.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read

      - name: Resolve platform and component versions
        id: versions
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          NX_DAEMON: 'false'
        run: |
          git checkout -B "$RELEASE_BRANCH" "$RELEASE_SOURCE_SHA"
          bun run release:prepare

      - name: Export changed service matrix
        id: matrix
        if: steps.versions.outputs.has-releases == 'true'
        run: |
          bash .github/scripts/discover-services.sh > .nx/releases/discovered-services.json
          node .github/scripts/release-matrix.mjs .nx/releases/discovered-services.json > .nx/releases/matrix.json
          echo "matrix=$(jq -c . .nx/releases/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has-services=$(jq '.include | length > 0' .nx/releases/matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release plan
        if: steps.versions.outputs.has-releases == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-release-plan
          path: .nx/releases/
          include-hidden-files: true

  images:
    name: Build ${{ matrix.product }}
    needs: prepare
    if: needs.prepare.outputs.has-releases == 'true' && needs.prepare.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      release-group: ${{ matrix.releaseName }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      version: ${{ matrix.candidateVersion }}
      artifact-version: ${{ matrix.version }}
      source-ref: ${{ matrix.sourceSha }}
      publish-mode: release
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the platform release
    needs: [prepare, images]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.has-releases == 'true' && (needs.prepare.outputs.has-services != 'true' || needs.images.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-release-plan
          path: .nx/releases
      - name: Download signed image results
        if: needs.prepare.outputs.has-services == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-result-*
          path: .nx/releases/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint the Teck Automation GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Promote signed digests and publish with Auto
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p .nx/releases/images
          git checkout -B "$RELEASE_BRANCH" "$RELEASE_SOURCE_SHA"
          bun run release:publish
