name: Release
on:
  push:
    branches: [main]

# Independent per-service releases. `nx release` versions each service group on its
# own (conventional commits), tags it (`<product>@<version>`), and creates a GitHub
# release. Only the services that were actually bumped are then built, signed, and
# scanned via the reusable SLSA-L3 workflow - i.e. we build and ship only what changed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & tag changed services
    runs-on: ubuntu-latest
    # Skip the run triggered by nx release's own version commit, to avoid a loop.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write # push the version commit + tags
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          dotnet restore
          bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release (version, tag, GitHub release)
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version commit and tags
        run: |
          new_tags=$(git tag --points-at HEAD)
          git push origin HEAD:main
          if [ -n "$new_tags" ]; then
            # shellcheck disable=SC2086
            git push origin $new_tags
          fi

      - name: Plan per-service image builds
        id: plan
        run: |
          # Join the tags created by this release (<product>@<version>) with the
          # discovered backend services. Frontend tags (web@, ui@, ...) don't match a
          # backend service and are excluded - the reusable workflow builds .NET images.
          discovered=$(.github/scripts/discover-services.sh)
          items='[]'
          for tag in $(git tag --points-at HEAD); do
            product="${tag%@*}"
            version="${tag##*@}"
            entry=$(echo "$discovered" | jq -c --arg p "$product" '.[] | select(.product==$p)')
            [ -z "$entry" ] && continue
            item=$(echo "$entry" | jq -c \
              --arg v "$version" --arg ref "refs/tags/$tag" \
              '. + {version: $v, sourceRef: $ref}')
            items=$(echo "$items" | jq -c --argjson it "$item" '. + [$it]')
          done
          count=$(echo "$items" | jq 'length')
          echo "matrix=$(echo "$items" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-releases=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Releasing $count service image(s):"; echo "$items" | jq -r '.[] | "\(.product) @ \(.version)"'

  build-sign-sbom:
    name: Build ${{ matrix.product }}@${{ matrix.version }}
    needs: release
    if: needs.release.outputs.has-releases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    permissions:
      contents: write # create release assets (SBOM/VEX attachments)
      packages: write # push image to ghcr
      id-token: write # cosign keyless signing via GitHub OIDC
      attestations: write # SLSA provenance attestation
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      version: ${{ matrix.version }}
      source-ref: ${{ matrix.sourceRef }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      dependencytrack-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
