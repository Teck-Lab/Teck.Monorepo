name: PR Preview Images
on:
  pull_request:
    branches: [main, alpha, beta, next]
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && github.run_id || 'build' }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover affected preview services
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
      has-services: ${{ steps.services.outputs.has-services }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Resolve the proposed merge result
        id: source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Discover affected services
        id: services
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export NX_AFFECTED=$(bunx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json)
          services=$(bash .github/scripts/discover-services.sh)
          echo "matrix=$(jq -c '{include: .}' <<< "$services")" >> "$GITHUB_OUTPUT"
          echo "has-services=$(jq 'length > 0' <<< "$services")" >> "$GITHUB_OUTPUT"

  images:
    name: Preview ${{ matrix.product }}
    needs: discover
    if: needs.discover.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      release-group: ${{ matrix.releaseGroup }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      version: 0.0.0-preview.${{ github.event.pull_request.number }}.${{ github.run_id }}.${{ github.run_attempt }}
      source-ref: ${{ needs.discover.outputs.source-sha }}
      publish-mode: staging
      staging-tag: pr-${{ github.event.pull_request.number }}-${{ needs.discover.outputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: Record preview images
    needs: [discover, images]
    if: always() && needs.discover.result == 'success' && (needs.discover.outputs.has-services != 'true' || needs.images.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.discover.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Download signed preview image results
        if: needs.discover.outputs.has-services == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-result-*
          path: .nx/previews/images
          merge-multiple: true
      - name: Write the deployment handoff
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_SOURCE_SHA: ${{ needs.discover.outputs.source-sha }}
        run: |
          mkdir -p .nx/previews/images
          node .github/scripts/preview-manifest.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-manifest-${{ github.event.pull_request.number }}
          path: .nx/previews/preview-manifest.json
          include-hidden-files: true
