name: Canary Preview
on:
  pull_request:
    types: [labeled, synchronize]

# Runs while the `preview` label is on the PR. Builds each AFFECTED service through the
# reusable pipeline in staging mode, producing a `canary-<pr#>` image plus a
# `:sha-<short>` stamp. Scan, SBOM, and signing run as normal build outputs.
permissions:
  contents: read

concurrency:
  # Unrelated label events get a unique group so they cannot cancel an active
  # preview build before the job-level filter skips them.
  group: canary-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && github.run_id || 'build' }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover affected services
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover affected services
        id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          affected=$(bunx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>/dev/null || echo "")
          [ -n "$affected" ] && export NX_AFFECTED="$affected"
          services=$(.github/scripts/discover-services.sh)
          count=$(echo "$services" | jq 'length')
          echo "matrix=$(echo "$services" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has-services=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Affected service(s):"; echo "$services" | jq -r '.[].product'

  canary:
    name: Canary ${{ matrix.product }}
    needs: discover
    if: needs.discover.outputs.has-services == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-sign-sbom.yml
    with:
      service-group: ${{ matrix.group }}
      service-name: ${{ matrix.service }}
      nx-project: ${{ matrix.nxProject }}
      project-path: ${{ matrix.projectPath }}
      # Preview version is derived from the PR run number; the image tag is
      # canary-<pr#>, so every push updates the ephemeral preview image.
      version: ${{ matrix.baseVersion }}-preview.${{ github.run_number }}
      source-ref: ${{ github.event.pull_request.head.sha }}
      publish-mode: staging
      staging-tag: canary-${{ github.event.pull_request.number }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
