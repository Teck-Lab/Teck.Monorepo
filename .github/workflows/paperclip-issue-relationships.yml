name: GitHub Issue Relationships

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Add or remove the selected native relationship
        required: true
        type: choice
        options: [add, remove]
      relationship:
        description: Direction is from source issue to related item (see .github/ISSUE_RELATIONSHIPS.md)
        required: true
        default: relates-to
        type: choice
        options: [relates-to, blocked-by, blocking, sub-issue, parent, branch, pull-request]
      source-repository:
        description: Repository containing the source issue
        required: true
        default: Teck.Monorepo
        type: choice
        options: [Teck.Monorepo, Teck.Terraform, Teck.GitOps]
      issue-number:
        description: Source issue number (not a pull request)
        required: true
        type: string
      related-repository:
        description: Repository containing the related issue, PR or branch
        required: true
        default: Teck.Monorepo
        type: choice
        options: [Teck.Monorepo, Teck.Terraform, Teck.GitOps]
      related-issue-number:
        description: Related issue or PR number; leave blank for branch
        required: false
        type: string
      branch-name:
        description: Branch only; add creates a NEW linked branch, remove unlinks without deleting it
        required: false
        type: string
      base-branch:
        description: Branch creation only; blank uses the related repository default branch
        required: false
        type: string

run-name: >-
  ${{ inputs.operation }} ${{ inputs.relationship || 'relates-to' }}
  ${{ inputs.source-repository || 'Teck.Monorepo' }}#${{ inputs.issue-number }}

permissions:
  contents: read

# Serialize bridge writes, including reversed/cross-repository edges.
concurrency:
  group: github-issue-relationships
  cancel-in-progress: false
  queue: max

jobs:
  synchronize:
    name: Apply and verify native relationship
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPERATION: ${{ inputs.operation }}
      RELATIONSHIP: ${{ inputs.relationship }}
      SOURCE_REPOSITORY: Teck-Lab/${{ inputs.source-repository || 'Teck.Monorepo' }}
      ISSUE_NUMBER: ${{ inputs.issue-number }}
      RELATED_REPOSITORY: ${{ inputs.related-repository }}
      RELATED_ISSUE_NUMBER: ${{ inputs.related-issue-number }}
      BRANCH_NAME: ${{ inputs.branch-name }}
      BASE_BRANCH: ${{ inputs.base-branch }}
    steps:
      - name: Check out trusted bridge code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test bridge and validate inputs before minting credentials
        run: |
          node --test .github/scripts/issue-relationships.test.mjs
          node .github/scripts/issue-relationships.mjs --validate

      - name: Mint repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo,Teck.Terraform,Teck.GitOps
          permission-issues: write
          permission-contents: ${{ inputs.relationship == 'branch' && (inputs.operation == 'add' && 'write' || 'read') || '' }}
          permission-pull-requests: ${{ inputs.relationship == 'pull-request' && 'write' || '' }}

      - name: Apply and verify native relationship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/issue-relationships.mjs
