name: Security Alert Intake

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect alerts without creating or changing issues
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-alert-intake
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize alerts with issues and Teck Scrum
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TECK_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TECK_AUTOMATION_APP_PRIVATE_KEY }}
          owner: Teck-Lab
          repositories: Teck.Monorepo
          permission-issues: write
          permission-organization-projects: write
          permission-secret-scanning-alerts: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - name: Checkout security intake policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize security alerts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SECURITY_INTAKE_DRY_RUN: ${{ inputs['dry-run'] || 'false' }}
        run: node .github/scripts/security-alert-intake.mjs
