        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    groups:
      nx-minor-patch:
        applies-to: version-updates
        patterns: ["nx", "@nx/*"]
        update-types: [minor, patch]
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["nx", "@nx/*"]
        update-types: [minor, patch]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
