version: 2
# Renovate owns scheduled dependency version updates. These entries retain
# ecosystem metadata for Dependabot security-alert remediation while preventing
# Dependabot from opening competing routine version-update pull requests.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dotnet-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
