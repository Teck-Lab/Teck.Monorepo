version: 2
updates:
  # Keep one allowed scope for all dependency types; include: scope would
  # let Dependabot choose deps or deps-dev instead.
  # NuGet uses one repository-wide Directory.Packages.props, but discovery is
  # scoped so the native updater does not restore the entire monorepo in one
  # job. Minor and patch updates become one PR per scope; major updates remain
  # individual PRs for explicit review.
  - package-ecosystem: nuget
    directory: /src/services/commerce/basket
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      basket-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /src/services/commerce/catalog
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      catalog-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /src/services/commerce/customer
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 5
    cooldown:
