name: Set up CI dependencies
description: Install the repository SDK and Bun, and reuse downloaded packages across CI jobs.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Cache downloaded dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.nuget/packages
          ~/.bun/install/cache
        key: ci-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/NuGet.Config', '**/nuget.config') }}
        restore-keys: |
          ci-dependencies-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
