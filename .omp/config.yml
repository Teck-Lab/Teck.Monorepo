  plan: omniroute/teck-orchestrator
  slow: omniroute/teck-orchestrator
  advisor: omniroute/teck-advisor
  vision: omniroute/teck-orchestrator
  task: omniroute/teck-executor
  designer: omniroute/teck-executor
  smol: omniroute/teck-fast-tool
  tiny: omniroute/teck-fast-tool
  commit: omniroute/teck-fast-text
advisor:
  enabled: true
enabledModels:
  - omniroute/teck-orchestrator
  - omniroute/teck-advisor
  - omniroute/teck-executor
