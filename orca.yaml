scripts:
  setup: bun install --frozen-lockfile
setupAgentStartupPolicy: start-immediately

environmentRecipes:
  - id: local-docker-sandbox
    name: Docker Sandbox (OMP)
    create: .\scripts\orca-sbx\create.cmd
    suspend: .\scripts\orca-sbx\suspend.cmd
    resume: .\scripts\orca-sbx\resume.cmd
    destroy: .\scripts\orca-sbx\destroy.cmd

  - id: local-devcontainer
    name: Local Dev Container
    create: .\scripts\orca-vm\local-create.cmd
    suspend: .\scripts\orca-vm\local-suspend.cmd
    resume: .\scripts\orca-vm\local-resume.cmd
    destroy: .\scripts\orca-vm\local-destroy.cmd
