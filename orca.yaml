environmentRecipes:
  - id: local-docker-sandbox
    name: Docker Sandbox (OMP)
    create: .\scripts\orca-sbx\create.cmd
    suspend: .\scripts\orca-sbx\suspend.cmd
    resume: .\scripts\orca-sbx\resume.cmd
    destroy: .\scripts\orca-sbx\destroy.cmd

  - id: local-devcontainer
    name: Local Dev Container
    create: '%ORCA_REPO_PATH%\scripts\orca-vm\local-create.cmd'
    suspend: '%ORCA_REPO_PATH%\scripts\orca-vm\local-suspend.cmd'
    resume: '%ORCA_REPO_PATH%\scripts\orca-vm\local-resume.cmd'
    destroy: '%ORCA_REPO_PATH%\scripts\orca-vm\local-destroy.cmd'
