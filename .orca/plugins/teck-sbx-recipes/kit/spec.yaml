schemaVersion: "2"
kind: mixin
name: teck-orca-omp-worker
displayName: Teck Orca OMP worker
description: Adds the Teck OMP runtime checker and network policy.

environment:
  variables:
    OMNIROUTE_BASE_URL: https://omniroute.tecklab.dk/v1
    OMNIROUTE_API_KEY: proxy-managed
    OMNIROUTE_MODEL: teck-orchestrator
    ONNXRUNTIME_NODE_INSTALL: skip
    OMP_SKIP_SETUP: "1"
    SEARXNG_ENDPOINT: https://search.tecklab.dk
    SEARXNG_TOKEN: proxy-managed-searxng
    CRAWL4AI_API_TOKEN: proxy-managed-crawl4ai
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    PUPPETEER_PROXY: http://gateway.docker.internal:3128
    PUPPETEER_PROXY_IGNORE_CERT_ERRORS: "true"

setup:
  files:
    - path: /home/agent/.local/bin/orca-runtime-check
      mode: "0755"
      description: Verify Orca orchestration after the SSH attach
      content: |
        #!/usr/bin/env sh
        set -eu

        cli="$(printenv ORCA_CLI_COMMAND 2>/dev/null || true)"
        dev_root="$(printenv ORCA_DEV_REPO_ROOT 2>/dev/null || true)"
        if [ -z "$cli" ] && [ -n "$dev_root" ] && command -v orca-dev >/dev/null 2>&1; then
          cli=orca-dev
        fi
        if [ -z "$cli" ] && command -v orca-ide >/dev/null 2>&1; then
          cli=orca-ide
        fi
        if [ -z "$cli" ] && command -v orca >/dev/null 2>&1; then
          cli=orca
        fi
        if [ -z "$cli" ]; then
          echo "Orca CLI is unavailable after the SSH attach" >&2
          exit 1
        fi

        "$cli" status --json >/dev/null
        "$cli" skills get orchestration >/dev/null
        "$cli" orchestration run-list --json >/dev/null
        test "$(git config --global --bool commit.gpgsign)" = true
        test -x "$HOME/.local/bin/orca-gpg"
        signing_key="$(git config --global user.signingkey)"
        test -n "$signing_key"
        printf 'teck-sandbox-runtime-signing-check' |
          "$HOME/.local/bin/orca-gpg" --batch --pinentry-mode loopback \
            --passphrase '' --yes --local-user "$signing_key" \
            --output /dev/null --detach-sign
        printf 'GPG commit signing available with %s\n' "$signing_key" >&2
        printf 'Orca orchestration runtime available via %s\n' "$cli" >&2

permissions:
  network:
    allow:
      - omniroute.tecklab.dk:443
      - search.tecklab.dk:443
      - reader.tecklab.dk:443
      - github.com:443
      - api.github.com:443
      - archive.ubuntu.com:80
      - security.ubuntu.com:80
      - semgrep.dev:443
      - registry.semgrep.dev:443
