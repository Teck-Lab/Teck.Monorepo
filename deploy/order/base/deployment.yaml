apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/part-of: commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
    spec:
      initContainers:
        - name: migration
          image: order-api
          args: ["--migrate"]
          envFrom:
            - secretRef:
                name: order-postgres
      containers:
        - name: order-api
          image: order-api
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: order-postgres
            - secretRef:
                name: order-rabbitmq
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
          startupProbe:
            httpGet:
              path: /alive
              port: 8080
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
