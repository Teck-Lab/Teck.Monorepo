apiVersion: apps/v1
kind: Deployment
metadata:
  name: {SERVICE_NAME}
  labels:
    app.kubernetes.io/name: {SERVICE_NAME}
    app.kubernetes.io/part-of: {GROUP}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {SERVICE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {SERVICE_NAME}
    spec:
      initContainers:
        - name: migration
          image: {SERVICE_NAME}
          args: ["--migrate"]
          envFrom:
            - secretRef:
                name: {SERVICE_NAME}-postgres
      containers:
        - name: {SERVICE_NAME}
          image: {SERVICE_NAME}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: {SERVICE_NAME}-postgres
            - secretRef:
                name: {SERVICE_NAME}-rabbitmq
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
