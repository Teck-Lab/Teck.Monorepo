services:
  workspace:
    volumes:
      - ..:/workspaces/Teck.Monorepo:cached
      - ./ai/providers.env:/run/secrets/teck-ai/providers.env:ro
      - ./mcp/mcp.env:/run/secrets/teck-mcp/mcp.env:ro
  crawl4ai:
    secrets:
      - source: teck_mcp_env
        target: /run/secrets/teck-mcp/mcp.env

secrets:
  teck_mcp_env:
    file: ./mcp/mcp.env
