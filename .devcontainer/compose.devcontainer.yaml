services:
  workspace:
    volumes:
      - ..:/workspaces/Teck.Monorepo:cached
      - ${TECK_PROTON_PAT_FILE:-${HOME}/.config/teck-orca/proton-pass.pat}:/run/bootstrap/proton-pass.pat:ro
      - ${TECK_PROTON_REFS_FILE:-./github-app/proton-pass.env}:/run/bootstrap/proton-pass.env:ro
      - ${TECK_MCP_ENV_FILE:-./mcp/mcp.env}:/run/secrets/teck-mcp/mcp.env:ro
    tmpfs:
      - /run/secrets/teck-runtime
      - /run/secrets/teck-github
      - /run/secrets/teck-ai
  crawl4ai:
    secrets:
      - source: teck_mcp_env
        target: /run/secrets/teck-mcp/mcp.env

secrets:
  teck_mcp_env:
    file: ${TECK_MCP_ENV_FILE:-./mcp/mcp.env}
