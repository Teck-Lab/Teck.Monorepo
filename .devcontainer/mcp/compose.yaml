# Self-hosted MCP backends for OpenCode research agents
# (oracle, librarian, fixer). Secrets and the SearXNG settings file are prepared
# on the host before Compose starts.
#
# Images are PINNED per the repo convention — never `latest`. Bump deliberately.
#
# To apply edits on an already-running stack:
#   docker compose -f .devcontainer/mcp/compose.yaml up -d --force-recreate
services:
  searxng:
    image: searxng/searxng:2026.7.19-6da6eee26
    expose:
      - "8080"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      # Our rendered settings.yml, NOT the image's auto-generated stub — the stub
      # leaves JSON output disabled and every MCP search 403s. Generated by
      # prepare-compose.sh from settings.template.yml. Read-only: searxng has no reason
      # to rewrite its own config, and a writable mount would let a container
      # restart silently clobber the JSON setting.
      - ./mcp/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    # The host secret remains 0600. The loader/supervisor starts as root so it
    # can read the file; the image's supervisor configuration runs Redis and
    # Gunicorn as appuser.
    user: root
    expose:
      - "11235"
    environment:
      - HOME=/home/appuser
      - USER=appuser
      # The image hardcodes gunicorn to 127.0.0.1, which Docker's port proxy
      # cannot reach — the symptom is "Connection reset by peer" from the host
      # while the container reports healthy, because its healthcheck runs
      # INSIDE. The supervisord command reads this variable, so we rebind here.
      #
      # crawl4ai's startup guard REFUSES a non-loopback bind without
      # CRAWL4AI_API_TOKEN set (loaded from the mounted secret file by the
      # command below). That guard is deliberate —
      # an unauthenticated crawler on an open interface is a genuine SSRF
      # surface — so we supply a token rather than disable the check.
      - GUNICORN_BIND=0.0.0.0:11235
    command:
      - bash
      - -lc
      - set -a; source /run/secrets/teck-mcp/mcp.env; set +a; exec bash entrypoint.sh
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      # Generous: the first start unpacks a Chromium-bearing image.
      retries: 12
