# LiteLLM gateway for the dev container. Brought up by ../start-litellm.sh from
# the devcontainer postStartCommand (via docker-in-docker). Single stateless
# service — no Redis/Postgres (see config.yaml for why). Relative paths resolve
# against this file's directory (.devcontainer/litellm/).
services:
  app:
    #container_name: javadev
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
        NX_DAEMON: true
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        DOTNET_NOLOGO: "1"
        NUGET_XMLDOC_MODE: "skip"
        NODE_OPTIONS: "--max-old-space-size=4096"
        CLAUDE_CONFIG_DIR: "/home/vscode/.claude-config"
    volumes:
      - ../..:/workspaces:cached
      
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use "networks" instead of "network_mode"
    networks:
      - development_network

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    # example api: http://localhost:8080/api/v1/public/greeting
    ports:
      - 8080:8080
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./litellm/litellm.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # The image has python but not necessarily curl — probe with urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - development_network
  searxng:
    image: searxng/searxng:2026.7.19-6da6eee26
    container_name: teck-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      # Our rendered settings.yml, NOT the image's auto-generated stub — the stub
      # leaves JSON output disabled and every MCP search 403s. Generated by
      # start-mcp.sh from settings.template.yml. Read-only: searxng has no reason
      # to rewrite its own config, and a writable mount would let a container
      # restart silently clobber the JSON setting.
      - ./mcp/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - development_network
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    container_name: teck-crawl4ai
    ports:
      - "11235:11235"
    env_file:
      # Holds CRAWL4AI_API_TOKEN. Gitignored; generated by start-mcp.sh.
      - ./mcp/mcp.env
    environment:
      # The image hardcodes gunicorn to 127.0.0.1, which Docker's port proxy
      # cannot reach — the symptom is "Connection reset by peer" from the host
      # while the container reports healthy, because its healthcheck runs
      # INSIDE. The supervisord command reads this variable, so we rebind here.
      #
      # crawl4ai's startup guard REFUSES a non-loopback bind without
      # CRAWL4AI_API_TOKEN set (see env_file above). That guard is deliberate —
      # an unauthenticated crawler on an open interface is a genuine SSRF
      # surface — so we supply a token rather than disable the check.
      - GUNICORN_BIND=0.0.0.0:11235
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      # Generous: the first start unpacks a Chromium-bearing image.
      retries: 12
    networks:
      - development_network

networks:
  development_network:
    driver: bridge