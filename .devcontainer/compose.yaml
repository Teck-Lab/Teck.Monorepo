services:
  workspace:
    privileged: true
    entrypoint: ["/usr/local/bin/teck-workspace-entrypoint"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235/mcp/sse
    volumes:
      - ..:/workspaces/Teck.Monorepo:cached
      - ${TECK_MCP_ENV_FILE:-./mcp/mcp.env}:/run/secrets/teck-mcp/mcp.env:ro

  crawl4ai:
    secrets:
      - source: teck_mcp_env
        target: /run/secrets/teck-mcp/mcp.env

secrets:
  teck_mcp_env:
    file: ${TECK_MCP_ENV_FILE:-./mcp/mcp.env}
