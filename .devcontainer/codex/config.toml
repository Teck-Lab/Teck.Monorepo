# Codex CLI config — seeded into ~/.codex/config.toml by postCreate.sh.
#
# Uses direct OpenAI authentication mounted from WSL2. OpenCode/OMO owns the
# lower-cost provider fallback chains; Codex remains the GPT-native path.

model = "gpt-5.6-terra"
model_provider = "openai"

# The dev container itself is the security boundary (privileged, convenience-first
# — see README "Security"). Disable Codex's inner sandbox + approval prompts for
# headless agent use, mirroring the `claude --dangerously-skip-permissions` alias.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Local stdio GitHub MCP authenticated as the repository-scoped GitHub App.
# It is optional until .devcontainer/github-app/ has been populated locally.
[mcp_servers.github]
command = "/usr/local/bin/teck-github-mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled_tools = [
  "get_repository_tree",
  "get_file_contents",
  "get_commit",
  "list_branches",
  "list_commits",
  "issue_read",
  "issue_write",
  "sub_issue_write",
  "add_issue_comment",
  "search_issues",
  "list_issues",
  "create_pull_request",
  "update_pull_request",
  "pull_request_read",
  "list_pull_requests",
  "search_pull_requests",
  "actions_get",
  "actions_list",
  "get_job_logs",
]
