# LiteLLM proxy config for the dev-container gateway.
#
# PER-MODEL POOLS (for oh-my-opencode-slim, which pins each agent to a specific
# `provider/model`). Each `model_name` below is a REAL model id; clients call it as
# `litellm/<model_name>`. Under each name sits a POOL of every route that serves
# that exact model (flat-rate OpenCode Go, free OpenCode Zen, free NVIDIA NIM, paid
# DeepSeek API, OpenRouter, etc.). usage-based-routing-v2 sends each request to the
# route with the most rpm/tpm HEADROOM; a route that 429s is cooled and traffic
# shifts to the rest — so a single model never hits one provider's limit.
#
# `rpm:` on a route = that provider's documented free limit (load-bearing — without
# it the router won't respect the cap). Flat-rate OpenCode Go routes carry no rpm
# (dollar-limited, not request-limited) and lean on the reactive cooldown.
#
# Cross-MODEL fallback (e.g. agent's model down -> try another model) is handled by
# oh-my-opencode-slim's top-level `fallback` block, NOT here — LiteLLM only balances
# routes WITHIN a model. Keep this in sync with .devcontainer/opencode/opencode.json's
# `models`.
#
# `os.environ/NAME` reads NAME from the container env (via the gitignored
# .devcontainer/litellm/litellm.env). Verify exact model ids with a probe before
# relying on any single route — ids drift between providers/dates.
model_list:
  # ============================ deepseek-v4-pro ======================
  - model_name: deepseek-v4-pro            # OpenCode Go sub A (flat-rate) — defines shared OpenCode anchors
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: &oc_base https://opencode.ai/zen/go/v1
      api_key: &oc_key os.environ/OPENCODE_GO_KEY
      extra_headers: &oc_ua
        User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
      timeout: 60
  - model_name: deepseek-v4-pro            # OpenCode Go sub B — defines the second-sub anchor
    litellm_params: { model: openai/deepseek-v4-pro, api_base: *oc_base, api_key: &oc_key2 os.environ/OPENCODE_GO_KEY_2, extra_headers: *oc_ua, timeout: 60 }
  - model_name: deepseek-v4-pro            # NVIDIA NIM (free 40 RPM)
    litellm_params: { model: openai/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY, rpm: 40, timeout: 45 }
  - model_name: deepseek-v4-pro            # DeepSeek official API (paid, reliable)
    litellm_params: { model: deepseek/deepseek-v4-pro, api_key: os.environ/DEEPSEEK_API_KEY, thinking: { type: enabled }, timeout: 60 }

  # ============================ deepseek-v4-flash ====================
  - model_name: deepseek-v4-flash          # OpenCode Go sub A
    litellm_params: { model: openai/deepseek-v4-flash, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: deepseek-v4-flash          # OpenCode Go sub B
    litellm_params: { model: openai/deepseek-v4-flash, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: deepseek-v4-flash          # OpenCode Zen FREE (/zen/v1, no balance) — defines zen anchor
    litellm_params: { model: openai/deepseek-v4-flash-free, api_base: &ocz_base https://opencode.ai/zen/v1, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: deepseek-v4-flash          # NVIDIA NIM (free 40 RPM)
    litellm_params: { model: openai/deepseek-ai/deepseek-v4-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY, rpm: 40, timeout: 45 }
  - model_name: deepseek-v4-flash          # DeepSeek official API (paid, ~0.4s)
    litellm_params: { model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, thinking: { type: disabled }, timeout: 30 }

  # ============================ glm-5.2 ==============================
  - model_name: glm-5.2                    # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/glm-5.2, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 60 }
  - model_name: glm-5.2                    # OpenCode Go sub B
    litellm_params: { model: openai/glm-5.2, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 60 }
  - model_name: glm-5.2                    # OpenRouter (paid, from credit)
    litellm_params: { model: openrouter/z-ai/glm-5.2, api_key: os.environ/OPENROUTER_API_KEY, rpm: 20, timeout: 60 }

  # ============================ minimax-m3 ===========================
  - model_name: minimax-m3                 # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/minimax-m3, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 60 }
  - model_name: minimax-m3                 # OpenCode Go sub B
    litellm_params: { model: openai/minimax-m3, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 60 }
  - model_name: minimax-m3                 # OpenRouter (paid, from credit)
    litellm_params: { model: openrouter/minimax/minimax-m3, api_key: os.environ/OPENROUTER_API_KEY, rpm: 20, timeout: 60 }

  # ============================ mimo-v2.5 ============================
  - model_name: mimo-v2.5                  # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/mimo-v2.5, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: mimo-v2.5                  # OpenCode Go sub B
    litellm_params: { model: openai/mimo-v2.5, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: mimo-v2.5                  # OpenCode Zen FREE
    litellm_params: { model: openai/mimo-v2.5-free, api_base: *ocz_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: mimo-v2.5                  # OpenRouter (paid, from credit)
    litellm_params: { model: openrouter/xiaomi/mimo-v2.5, api_key: os.environ/OPENROUTER_API_KEY, rpm: 20, timeout: 30 }

  # ============================ kimi (coder) =========================
  - model_name: kimi-k3                     # OpenCode Go sub A (flat-rate) — sisyphus primary
    litellm_params: { model: openai/kimi-k3, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: kimi-k3                     # OpenCode Go sub B
    litellm_params: { model: openai/kimi-k3, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: kimi-k2.7-code             # OpenCode Go sub A (flat-rate) — primary coder
    litellm_params: { model: openai/kimi-k2.7-code, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: kimi-k2.7-code             # OpenCode Go sub B
    litellm_params: { model: openai/kimi-k2.7-code, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  # NOTE: there is no plain `kimi-k2.7` on OpenCode Go — the Go /models endpoint
  # serves kimi-k2.5, kimi-k2.6, kimi-k2.7-code, kimi-k3. Use kimi-k2.7-code for
  # the K2.7 generation. (A `kimi-k2.7` group used to live here and could never
  # resolve.) Verify ids against /zen/go/v1/models before adding a route.
  - model_name: kimi-k2.6                   # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/kimi-k2.6, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: kimi-k2.6                   # OpenCode Go sub B
    litellm_params: { model: openai/kimi-k2.6, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: kimi-k2.6                   # NVIDIA NIM (free 40 RPM) — moonshotai/kimi-k2.6
    litellm_params: { model: openai/moonshotai/kimi-k2.6, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY, rpm: 40, timeout: 45 }

  # ============================ qwen (OpenCode Go) ===================
  - model_name: qwen3.7-max                # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/qwen3.7-max, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 60 }
  - model_name: qwen3.7-max                # OpenCode Go sub B
    litellm_params: { model: openai/qwen3.7-max, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 60 }
  - model_name: qwen3.7-plus               # OpenCode Go sub A (flat-rate)
    litellm_params: { model: openai/qwen3.7-plus, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: qwen3.7-plus               # OpenCode Go sub B
    litellm_params: { model: openai/qwen3.7-plus, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: qwen3.6-plus               # OpenCode Go sub A (flat-rate) — visual/utility (guide)
    litellm_params: { model: openai/qwen3.6-plus, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: qwen3.6-plus               # OpenCode Go sub B
    litellm_params: { model: openai/qwen3.6-plus, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: qwen3.5-plus               # OpenCode Go sub A (flat-rate) — visual/utility (guide)
    litellm_params: { model: openai/qwen3.5-plus, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: qwen3.5-plus               # OpenCode Go sub B
    litellm_params: { model: openai/qwen3.5-plus, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }

  # ============================ hy3 ==================================
  - model_name: hy3                        # OpenCode Go preview, sub A (flat-rate)
    litellm_params: { model: openai/hy3-preview, api_base: *oc_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }
  - model_name: hy3                        # OpenCode Go preview, sub B
    litellm_params: { model: openai/hy3-preview, api_base: *oc_base, api_key: *oc_key2, extra_headers: *oc_ua, timeout: 30 }
  - model_name: hy3                        # OpenCode Zen FREE
    litellm_params: { model: openai/hy3-free, api_base: *ocz_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }

  # ============================ OpenCode Zen FREE-only ===============
  - model_name: nemotron-3-ultra           # OpenCode Zen FREE (no balance consumed)
    litellm_params: { model: openai/nemotron-3-ultra-free, api_base: *ocz_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 60 }
  - model_name: north-mini-code            # OpenCode Zen FREE (no balance consumed)
    litellm_params: { model: openai/north-mini-code-free, api_base: *ocz_base, api_key: *oc_key, extra_headers: *oc_ua, timeout: 30 }

  # ============================ gemini ===============================
  # WARNING: the Gemini free tier's binding limit is 20 requests per DAY
  # (GenerateRequestsPerDayPerProjectPerModel-FreeTier), NOT per minute — `rpm`
  # cannot express a daily cap, so it only guards bursts. This is also a
  # SINGLE-ROUTE pool and LiteLLM does no cross-model fallback, so once the daily
  # quota is spent every call 429s hard. Keep high-frequency traffic off it
  # (that's why opencode-mem auto-capture uses deepseek-v4-flash); reserve it for
  # low-frequency vision work. Add a second Gemini key here to widen the pool.
  - model_name: gemini-2.5-flash           # Google Gemini (free tier: 20 req/DAY)
    litellm_params: { model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY, rpm: 10, timeout: 60 }

  # ============================ llama-3.3-70b ========================
  - model_name: llama-3.3-70b              # SambaNova (free)
    litellm_params: { model: sambanova/Meta-Llama-3.3-70B-Instruct, api_key: os.environ/SAMBANOVA_API_KEY, rpm: 30, timeout: 30 }
  - model_name: llama-3.3-70b              # Cloudflare Workers AI (acct id from CLOUDFLARE_ACCOUNT_ID env)
    litellm_params: { model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast, api_key: os.environ/CLOUDFLARE_API_KEY, rpm: 20, timeout: 30 }

  # ============================ Cloudflare / SambaNova single-route ==
  - model_name: deepseek-v3.2              # SambaNova (free)
    litellm_params: { model: sambanova/DeepSeek-V3.2, api_key: os.environ/SAMBANOVA_API_KEY, rpm: 20, timeout: 60 }
  - model_name: deepseek-r1-distill-qwen-32b   # Cloudflare
    litellm_params: { model: cloudflare/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b, api_key: os.environ/CLOUDFLARE_API_KEY, rpm: 20, timeout: 60 }
  - model_name: qwen2.5-coder-32b          # Cloudflare
    litellm_params: { model: cloudflare/@cf/qwen/qwen2.5-coder-32b-instruct, api_key: os.environ/CLOUDFLARE_API_KEY, rpm: 20, timeout: 30 }

router_settings:
  # Route each request to the pool member (route) with the most rpm/tpm headroom.
  routing_strategy: usage-based-routing-v2
  # No redis_host — single local instance, so in-memory usage counters are
  # authoritative. (Prod shared them across HPA replicas via Redis.)
  num_retries: 2         # retry a failed call on another route in the SAME model pool
  allowed_fails: 2       # 2 failures -> cool that route down
  cooldown_time: 900     # ...for 15min. NOT 60s: the failure we actually hit is an
                         # OpenCode Go spend-cap, whose window resets in HOURS. At 60s
                         # the capped sub re-entered rotation every minute and the user
                         # saw the billing error over and over.

  # THE IMPORTANT BIT — why two subscriptions didn't help.
  # OpenCode Go answers a blown spend cap with "Insufficient balance", and LiteLLM
  # maps that to AuthenticationError. Auth errors are NON-RETRYABLE by default (a
  # bad key won't fix itself), so the router surfaced the error instead of trying
  # the other subscription sitting in the same pool. These policies make an
  # auth-class failure retry on a DIFFERENT deployment and bench the dead one fast.
  retry_policy:
    AuthenticationErrorRetries: 2   # retry on another route (i.e. the other sub)
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 1   # one "Insufficient balance" -> cool it down
    RateLimitErrorAllowedFails: 2
  # No cross-model `fallbacks` — oh-my-opencode-slim owns cross-model fallback via
  # its top-level `fallback` block; LiteLLM only balances routes within one model.

litellm_settings:
  request_timeout: 120       # a hung upstream fails over in seconds
  set_verbose: false
  json_logs: true
  drop_params: true          # silently drop params a given provider doesn't support

general_settings:
  # Clients authenticate to the GATEWAY with this key (not a provider key).
  master_key: os.environ/LITELLM_MASTER_KEY
